name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token. CI builds and tests; it never publishes, signs or deploys.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The Gradle daemon is pinned to JDK 21 (gradle/gradle-daemon-jvm.properties);
      # both modules still compile to JVM target 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Pure-JVM parser first: the fastest signal, and the accuracy harness that
      # fails the build on any wrong extracted value.
      - name: Parser tests
        run: ./gradlew :parser:test --stacktrace

      # No keystore.properties exists here, so release signing is never configured
      # and only debug builds are produced. No secrets are used by this workflow.
      - name: Lint, unit tests and debug builds (both flavors)
        run: >
          ./gradlew
          lint
          testPlayDebugUnitTest
          testDirectDebugUnitTest
          assemblePlayDebug
          assembleDirectDebug
          --stacktrace

      # Lint warnings never fail the build, and the reports below are uploaded only
      # when something does fail, so on a green build nobody saw them. The two real
      # bugs lint found in August were found by reading the report by hand. AGP always
      # writes a text report; printing it puts every warning in the log of every run.
      - name: Print the lint report
        if: ${{ !cancelled() }}
        run: find app/build -name '*lint*.txt' -print -exec cat {} \;

      # Room rewrites app/schemas on every compile. A schema JSON that differs from
      # the committed one, or a new version nobody committed, means the next migration
      # would be tested against a schema the repository does not have. The diff is
      # printed in full, so a missing file can be committed exactly as Room wrote it.
      - name: Exported Room schemas are committed
        if: ${{ !cancelled() }}
        run: |
          git add --intent-to-add app/schemas
          git diff --exit-code -- app/schemas

      # Coverage is reported, never gated (the reasoning is in app/build.gradle.kts).
      # The play unit tests already ran above, so this only writes the report. It is
      # uploaded on every green build, because the uncovered lines are the useful part.
      - name: Coverage report (play debug)
        run: ./gradlew :app:jacocoPlayDebugReport --stacktrace

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-play-debug
          path: app/build/reports/jacoco/jacocoPlayDebugReport/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            parser/build/reports/
            app/build/reports/
          retention-days: 7

      - name: Upload play debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-play-debug
          path: app/build/outputs/apk/play/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload direct debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-direct-debug
          path: app/build/outputs/apk/direct/debug/*.apk
          if-no-files-found: error
          retention-days: 14
